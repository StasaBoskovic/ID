<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Izbor nacina igre</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <main class="phone-shell phone-shell-wide">
    <section class="screen-card">
      <div class="screen-head">
        <div class="screen-head-copy">
          <a class="back-link" href="login.html">&larr; Nazad</a>
          <p class="topline">Literary Quote Challenge</p>
        </div>
        <a class="secondary-button small-button" href="leaderboard.html">Leaderboard</a>
      </div>
      <h1 class="screen-title">Kako zelis da igras?</h1>
      <p class="page-copy left-copy">
        Mozes da prepustis izbor sistemu ili da sama izaberes knjige koje zelis u igri.
      </p>

      <div class="choice-stack">
        <button class="choice-card" id="randomChoiceButton" type="button">
          <span class="choice-title">Random literatura</span>
          <span class="choice-copy">Odmah ides na ekran igre sa nasumicnim knjizevnim izborom.</span>
        </button>

        <a class="choice-card choice-link" href="library.html">
          <span class="choice-title">Izaberi literaturu</span>
          <span class="choice-copy">Otvara se sledeca stranica sa knjigama koje mozes da oznacis.</span>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
