<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Izbor nacina igre</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <main class="phone-shell phone-shell-wide">
    <section class="screen-card">
      <div class="screen-head">
        <div class="screen-head-copy">
          <a class="back-link" href="login.html">&larr; Nazad</a>
          <p class="topline">Literary Quote Challenge</p>
        </div>
        <a class="secondary-button small-button" href="leaderboard.html">Tabela rezultata</a>
      </div>
      <h1 class="screen-title">Kako želiš da igraš?</h1>
      <p class="page-copy left-copy">
        Možeš da prepustiš izbor sistemu ili da sama izabereš knjige koje želiš u igri.
      </p>

      <div class="choice-stack">
        <button class="choice-card" id="randomChoiceButton" type="button">
          <span class="choice-title">Random literatura</span>
          <span class="choice-copy">Odmah ideš na ekran igre sa nasumičnim književnim izborom.</span>
        </button>

        <a class="choice-card choice-link" href="library.html">
          <span class="choice-title">Izaberi literaturu</span>
          <span class="choice-copy">Otvara se sledeća stranica sa knjigama koje možeš da označiš.</span>
        </a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
