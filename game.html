<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Game</title>
  <link rel="stylesheet" href="styles.css?v=20260602-1" />
</head>
<body class="page page-game">
  <main class="phone-shell phone-shell-wide">
    <section class="screen-card game-card">
      <div class="game-top">
        <div class="screen-head-copy">
          <p class="topline">Live round</p>
          <h1 class="screen-title small-title">Literary Duel</h1>
          <p class="page-copy">Answer fast, stay sharp, and protect your three lives.</p>
        </div>

        <div class="top-button-stack">
          <a class="secondary-button small-button" href="mode.html">New Game</a>
          <a class="secondary-button small-button" href="leaderboard.html">Leaderboard</a>
        </div>
      </div>

      <div class="progress-shell" aria-hidden="true">
        <span class="progress-fill" id="roundProgressBar"></span>
      </div>

      <div class="question-pills">
        <p class="setup-pill" id="setupLabel">Random Mode</p>
        <p class="setup-pill alt-pill" id="questionTypeLabel">Quote -> Author</p>
      </div>

      <p class="question-source" id="questionSource">Get ready for the first challenge.</p>

      <aside class="hint-card hint-card-inline" id="hintCard" hidden>
        <span class="hint-label">AI Hint</span>
        <p id="hintText"></p>
      </aside>

      <div class="stats-row">
        <div class="stat-box">
          <span>Score</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="stat-box">
          <span>Question</span>
          <strong id="roundValue">1</strong>
        </div>
        <div class="stat-box">
          <span>Mistakes</span>
          <strong id="mistakeValue">0/3</strong>
        </div>
        <div class="stat-box timer-box" id="timerBox">
          <span>Timer</span>
          <strong id="timerValue">20</strong>
        </div>
      </div>

      <div class="quote-panel">
        <p id="quoteText">Loading your first quote...</p>
      </div>

      <div class="answers-grid" id="answers"></div>

      <p class="game-feedback" id="gameFeedback"></p>

      <button class="primary-button" id="nextButton" type="button" hidden>Next Question</button>

      <div class="game-end-actions" id="endActions" hidden>
        <a class="secondary-button" href="leaderboard.html">View Leaderboard</a>
        <a class="primary-button action-button" href="mode.html">Play Again</a>
      </div>
    </section>
  </main>

  <script src="script.js?v=20260602-1"></script>
</body>
</html>
