<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Igra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <main class="phone-shell phone-shell-wide">
    <section class="screen-card game-card">
      <div class="game-top">
        <div>
          <p class="topline">Literary Quote Challenge</p>
          <h1 class="screen-title small-title">Ekran igre</h1>
        </div>
      </div>

      <div class="question-pills">
        <p class="setup-pill" id="setupLabel">Random literatura</p>
        <p class="setup-pill alt-pill" id="questionTypeLabel">Citat -> autor</p>
      </div>

      <p class="question-source" id="questionSource">Spremi se za prvi zadatak.</p>

      <div class="stats-row">
        <div class="stat-box">
          <span>Poeni</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="stat-box">
          <span>Pitanje</span>
          <strong id="roundValue">1</strong>
        </div>
        <div class="stat-box">
          <span>Greske</span>
          <strong id="mistakeValue">0/3</strong>
        </div>
        <div class="stat-box">
          <span>Tajmer</span>
          <strong id="timerValue">08</strong>
        </div>
      </div>

      <div class="quote-panel">
        <p id="quoteText">Ucitam prvi citat...</p>
      </div>

      <div class="answers-grid" id="answers"></div>

      <p class="game-feedback" id="gameFeedback"></p>

      <button class="primary-button" id="nextButton" type="button" hidden>Sledeći citat</button>

      <div class="game-end-actions" id="endActions" hidden>
        <a class="secondary-button" href="leaderboard.html">Tabela rezultata</a>
        <a class="primary-button action-button" href="mode.html">Nova igra</a>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
