<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Promeni lozinku</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <main class="phone-shell">
    <section class="screen-card">
      <a class="back-link" href="login.html">&larr; Nazad</a>
      <p class="topline">Literary Quote Challenge</p>
      <h1 class="screen-title">Promeni lozinku</h1>
      <p class="page-copy left-copy">Unesi mejl i kod koji ti stigne. Nakon potvrde koda pojaviće se drugi korak za novu lozinku.</p>

      <form id="forgotForm" class="stack-form" data-redirect="login.html">
        <p class="form-message" id="forgotMessage"></p>

        <label class="field">
          <span>E-mail adresa</span>
          <input type="email" name="email" placeholder="unesi@email.com" />
        </label>

        <label class="field" id="resetCodeField">
          <span>Verifikacioni kod</span>
          <input type="text" name="resetCode" placeholder="Unesi kod iz mejla" />
        </label>

        <label class="field" id="newPasswordField" style="display:none;">
          <span>Nova lozinka</span>
          <input type="password" name="newPassword" placeholder="Unesi novu lozinku" />
        </label>

        <label class="field" id="confirmPasswordField" style="display:none;">
          <span>Potvrdi novu lozinku</span>
          <input type="password" name="confirmPassword" placeholder="Ponovi novu lozinku" />
        </label>

        <button class="primary-button" type="submit">Pošalji kod</button>
      </form>

      <a class="guest-link" href="mode.html">Počni kao gost</a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
