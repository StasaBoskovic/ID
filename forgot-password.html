<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Reset Password</title>
  <link rel="stylesheet" href="styles.css?v=20260602-3" />
</head>
<body class="page page-auth">
  <main class="phone-shell">
    <section class="screen-card auth-card">
      <a class="back-link" href="login.html">&larr; Back</a>
      <p class="topline">Recovery flow</p>
      <h1 class="screen-title">Reset your password.</h1>
      <p class="page-copy left-copy">
        Enter your email and verification code, then create a new password and return to the game.
      </p>

      <form id="forgotForm" class="stack-form" data-redirect="login.html">
        <p class="form-message" id="forgotMessage"></p>

        <label class="field">
          <span>Email address</span>
          <input type="email" name="email" placeholder="enter@email.com" />
        </label>

        <label class="field" id="resetCodeField">
          <span>Verification code</span>
          <input type="text" name="resetCode" placeholder="Enter the code from your email" />
        </label>

        <label class="field" id="newPasswordField" style="display:none;">
          <span>New password</span>
          <input type="password" name="newPassword" placeholder="Enter a new password" />
        </label>

        <label class="field" id="confirmPasswordField" style="display:none;">
          <span>Confirm new password</span>
          <input type="password" name="confirmPassword" placeholder="Repeat your new password" />
        </label>

        <button class="primary-button" type="submit">Send Code</button>
      </form>

      <a class="guest-link" href="mode.html">Continue as Guest</a>
    </section>
  </main>

  <script src="script.js?v=20260602-3"></script>
</body>
</html>
