<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge | Register</title>
  <link rel="stylesheet" href="styles.css?v=20260602-3" />
</head>
<body class="page page-auth">
  <main class="phone-shell">
    <section class="screen-card auth-card">
      <a class="back-link" href="login.html">&larr; Back</a>
      <p class="topline">Create account</p>
      <h1 class="screen-title">Register and enter the challenge.</h1>
      <p class="page-copy left-copy">
        Create your profile to save your best runs and appear on the leaderboard.
      </p>

      <form id="signupForm" class="stack-form" data-redirect="mode.html">
        <p class="form-message" id="signupMessage"></p>

        <label class="field">
          <span>Username</span>
          <input type="text" name="username" placeholder="Choose a username" />
        </label>

        <label class="field">
          <span>Email address</span>
          <input type="email" name="email" placeholder="enter@email.com" />
        </label>

        <label class="field">
          <span>Password</span>
          <input type="password" name="password" placeholder="Create a password" />
        </label>

        <label class="field">
          <span>Confirm password</span>
          <input type="password" name="confirmPassword" placeholder="Repeat your password" />
        </label>

        <button class="primary-button" type="submit">Register</button>
      </form>

      <a class="guest-link" href="mode.html">Continue as Guest</a>
    </section>
  </main>

  <script src="script.js?v=20260602-3"></script>
</body>
</html>
