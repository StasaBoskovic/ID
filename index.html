<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Quote Challenge</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-home">
  <main class="phone-shell phone-shell-home">
    <section class="screen-card landing-card">
      <div class="hero-copy">
        <p class="topline">A modern literary game</p>
        <p class="hero-badge">3 question types &bull; 20+ classics &bull; fast rounds</p>
        <h1 class="game-name">Literary Quote Challenge</h1>
        <p class="page-copy">
          Guess the author, complete the missing word, and build the highest score before
          you reach three mistakes.
        </p>

        <div class="hero-highlights" aria-label="Game overview">
          <article class="highlight-card">
            <strong>3</strong>
            <span>smart question styles</span>
          </article>
          <article class="highlight-card">
            <strong>20s</strong>
            <span>for every answer</span>
          </article>
          <article class="highlight-card">
            <strong>20+</strong>
            <span>classic books in play</span>
          </article>
        </div>

        <div class="cta-row">
          <a class="primary-button hero-primary-button" href="login.html">Let's Begin</a>
        </div>
      </div>

      <div class="book-scene" aria-hidden="true">
        <div class="book-glow"></div>
        <div class="book-shadow"></div>
        <div class="big-book">
          <div class="big-book-back"></div>
          <div class="big-book-pages"></div>
          <div class="big-book-spine"></div>
          <div class="big-book-cover">
            <div class="book-frame"></div>
            <div class="book-seal">LQC</div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
